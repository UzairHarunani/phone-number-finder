<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Share location</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <main style="max-width:720px;margin:24px auto;padding:16px;">
    <h1>Share your location</h1>
    <p>Enter an identifier (phone or label), then tap Share. Allow location permission in the browser.</p>
    <input id="identifier" placeholder="Your phone or label" style="width:70%;padding:8px;border:1px solid #ccc;border-radius:4px;" />
    <button id="share" style="padding:8px 12px;margin-left:12px;">Share location</button>
    <div id="status" style="margin-top:12px;color:#333"></div>
  </main>

  <script>
    async function postLoc(payload) {
      const res = await fetch("/track/report", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(payload)
      });
      return res.json();
    }

    document.getElementById("share").addEventListener("click", async () => {
      const id = document.getElementById("identifier").value || "unknown";
      const status = document.getElementById("status");
      if (!navigator.geolocation) {
        status.textContent = "Geolocation not supported in this browser.";
        return;
      }
      status.textContent = "Requesting location…";
      navigator.geolocation.getCurrentPosition(async (pos) => {
        const payload = {
          identifier: id,
          lat: pos.coords.latitude,
          lon: pos.coords.longitude,
          accuracy: pos.coords.accuracy
        };
        await postLoc(payload);
        status.textContent = "Location shared. You can close this page.";
      }, (err) => {
        status.textContent = "Permission denied or error: " + err.message;
        // Optionally send identifier only as fallback
        postLoc({identifier: id});
      }, {enableHighAccuracy:true, timeout:10000});
    });
  </script>
</body>
</html>
